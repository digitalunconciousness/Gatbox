# This repository's part of the shared privacy check. scripts/privacy_check.sh and
# .githooks/pre-push are the same in all three repositories (owned by GATBOX); what differs
# is here. One setting per line, # comments and blank lines skipped:
#   forbid=<extended regex>   a path this repository must never commit, on top of the shared
#                             list (matched case-insensitively against each committed path)
#   allow_address=<regex>     a private address that is a documented default, not site data

# The roster, MAME set list and manual list: site data, git-ignored.
forbid=(^|/)data/gatbox-(barcade-roster|mame-sets|manuals)\.json$
# The handoff input folder (ignored, never published).
forbid=(^|/)handoff/
# NetworkManager's default shared-network address: the fallback hotspot's, the same on every Pi.
allow_address=(^|[^0-9.])10\.42\.0\.1([^0-9]|$)
