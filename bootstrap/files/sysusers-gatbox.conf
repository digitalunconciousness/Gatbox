# GATBOX (installed by gatbox-bootstrap.sh). gatbox-dump runs the dashboard's T48 dumps (gatbox-dump.service): the
# T48's USB node is group plugdev (minipro's udev rule), the archive and the spool are its own.
u gatbox-dump - "GATBOX T48 dumps" /nonexistent /usr/sbin/nologin
m gatbox-dump plugdev
# The manuals folder's group: the owner (gatbox-manuals fetch, files copied in) and gatbox-web (phone uploads).
g gatbox-manuals -
# gatbox-sync pushes finished sessions to the hub (gatbox-sync.timer). A real user rather
# than DynamicUser for one reason: a DynamicUser's StateDirectory is /var/lib/private/<name>
# at 0700, and gatbox-web -- a different dynamic user -- could never read the status the
# SYSTEM panel shows, nor the roster and open-orders caches the 7" will want.
u gatbox-sync - "GATBOX hub sync" /nonexistent /usr/sbin/nologin
