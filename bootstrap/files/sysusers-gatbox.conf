# GATBOX (installed by gatbox-bootstrap.sh). gatbox-dump runs the dashboard's T48 dumps (gatbox-dump.service): the
# T48's USB node is group plugdev (minipro's udev rule), the archive and the spool are its own.
u gatbox-dump - "GATBOX T48 dumps" /nonexistent /usr/sbin/nologin
m gatbox-dump plugdev
# The manuals folder's group: the owner (gatbox-manuals fetch, files copied in) and gatbox-web (phone uploads).
g gatbox-manuals -
# gatbox-fetch runs the LIBRARY's FIND A MANUAL job (gatbox-manuals.service): it searches archive.org and downloads a PDF into the
# manuals folder. Its own user, the one account here that reaches the internet on gatbox-web's behalf, holding only the manuals
# folder (the group gatbox-manuals) and its own spool, which gatbox-web joins through the group gatbox-fetch (its primary group).
u gatbox-fetch - "GATBOX manuals job" /nonexistent /usr/sbin/nologin
m gatbox-fetch gatbox-manuals
# gatbox-sync pushes finished sessions to the hub (gatbox-sync.timer). A real user rather
# than DynamicUser for one reason: a DynamicUser's StateDirectory is /var/lib/private/<name>
# at 0700, and gatbox-web -- a different dynamic user -- could never read the status the
# SYSTEM panel shows, nor the roster and open-orders caches the 7" will want.
u gatbox-sync - "GATBOX hub sync" /nonexistent /usr/sbin/nologin
# The Wi-Fi request spool's group: gatbox-web writes a request, gatbox-wifi (root) acts on
# it. A group rather than a user, because the helper is root and only the spool is shared.
g gatbox-wifi -
# gatbox-disk runs the dashboard's disk jobs (gatbox-disk.service: READ, TARGET CHECK, WRITE). Its own group is the devices'
# group: the udev rule gives it read and write on whole USB disks, and only this user holds it.
u gatbox-disk - "GATBOX disk jobs" /nonexistent /usr/sbin/nologin
# The disk spool's group: gatbox-web writes a request, gatbox-disk answers. The job, gatbox-web and the owner's login hold it,
# never the devices' group, so neither of the other two can open a drive directly.
g gatbox-disk-queue -
# gatbox-browse (gatbox-browse.service, F1 of docs/plans/2026-11-15-drive-browser.md) lists and shows what is inside a stored image.
# Its own user and group: the group is the one that may connect to its socket, and gatbox-web is the only member besides it.
u gatbox-browse - "GATBOX drive browser" /nonexistent /usr/sbin/nologin
