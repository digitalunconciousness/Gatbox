# GATBOX (installed by gatbox-bootstrap.sh).
# The dump archive: <machine>/<label>_<sha1:8>.bin + .json, written by gatbox-dump (setgid: the owner's group too).
d /srv/gatbox                0755 root        root        -
d /srv/gatbox/roms           2775 gatbox-dump gatbox-dump -
# Dashboard dump requests and progress: gatbox-web (in group gatbox-dump) writes request.json, the job answers.
d /var/spool/gatbox-dump     2770 gatbox-dump gatbox-dump -
# Manuals: <machine>/<name>.pdf (+ .json, .txt). Fetched by the owner, uploaded through gatbox-web (group
# gatbox-manuals), read by gatbox-web (world-readable, like the archive). Setgid: new folders keep the group.
d /srv/gatbox/manuals        2775 root        gatbox-manuals -
# The game library (phase B): library.sqlite and its -wal and -shm files, written by gatbox-library (the owner) and by
# gatbox-web (group gatbox-manuals). SQLite needs the directory itself writable, so it is its own folder, not a file in
# /srv/gatbox. Without it `gatbox-library seed --apply` cannot create the file under the root-owned /srv/gatbox.
d /srv/gatbox/library        2775 root        gatbox-manuals -
# The database and the -wal and -shm files SQLite keeps beside it must be group-writable, or the account that did not create
# them cannot write: the owner's `gatbox-library seed` makes library.sqlite 0644 under the usual umask, and gatbox-web (a
# different account, in the group gatbox-manuals) then fails every write with "attempt to write a readonly database" (the Pi,
# 2026-11-14: the 7" could not add a game and gatbox-sync's library push returned HTTP 500). `z` only adjusts what exists.
z /srv/gatbox/library/library.sqlite* 0664 - gatbox-manuals -
# The hub config (gatbox-sync): /etc/gatbox/hub.conf, 600 root, holding the hub URLs and the
# device token, and one more file per extra hub in hubs.d/<name>.conf. The directory is not
# world-readable so its contents are not merely 600 but unreachable. Only the owner has a
# token, so nothing here writes one: hub.conf is created *empty* if it is missing (an empty
# file means "no hub"; an existing one is never written, only kept at 600 root), and hubs.d
# starts empty. Both have to exist because gatbox-sync.service loads them with
# LoadCredential=, and a missing path there fails the unit outright.
d /etc/gatbox                0750 root        root        -
d /etc/gatbox/hubs.d         0700 root        root        -
f /etc/gatbox/hub.conf       0600 root        root        -
# The archive's address and the deck's tokens for it (the library's two-way sync, phase D3): the same rules as hub.conf.
# Created empty if it is missing (empty means no archive, and gatbox-sync has no library step); never written after that,
# only kept at 600 root, because the tokens are the owner's to put in.
f /etc/gatbox/archive.conf   0600 root        root        -
# Wi-Fi requests from the dashboard and from a scanned code. 2770, not 2775: a request file
# holds a plaintext Wi-Fi key until gatbox-wifi takes it, so this is not world-readable.
d /var/spool/gatbox-wifi     2770 root        gatbox-wifi -
# The disk job's spool: gatbox-web (group gatbox-disk-queue) writes request.json, gatbox-disk answers status.json. 2770 and
# setgid, like the dump's, so what lands in it keeps the queue group.
d /var/spool/gatbox-disk     2770 gatbox-disk gatbox-disk-queue -
# No disk job survives a boot. One that was running when the Pi was restarted or lost power leaves its running.json behind, and
# nothing treats an old one as dead: the DISK tab, a new request and every thumbnail wait on it for good. It is removed at boot
# ("!": boot only, so a bootstrap run never touches the claim of a job that is running now). A request that was only queued stays
# and runs; a write's arm has run out by then and is refused.
r! /var/spool/gatbox-disk/running.json
# The manuals job's spool: gatbox-web writes a request (it holds the group gatbox-fetch), the job answers.
d /var/spool/gatbox-manuals  2770 gatbox-fetch gatbox-fetch -
# The chip-list job's spool (phase D4): gatbox-web writes request.json, gatbox-mame-roms.service answers status.json. Setgid, so the
# answer keeps the group whoever wrote it.
d /var/spool/gatbox-mame     2770 root        gatbox-mame -
# The image store's mountpoint, bare. Root-owned and not writable by the job, so an unplugged store can never fill the SD
# card. Mode, owner and group are "-" ON PURPOSE: with the 4 TB drive mounted here this line would otherwise reset the
# drive's own root directory (gatbox-disk:gatbox-disk-queue, 2770) to root:root 0755 at every boot or run. "-" creates the
# directory when it is missing and leaves an existing one, mounted or not, alone.
d /srv/gatbox/disks          -    -           -           -
# The store drive's filesystem UUID, one line `UUID=...`. Site config, not git: created empty, never written after that. The
# bootstrap writes the store's mount unit only when it holds a UUID (docs/plans/2026-11-02-disk-imaging-store.sh puts it there).
f /etc/gatbox/disks.conf     0600 root        root        -
