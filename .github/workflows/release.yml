name: release

# A release is a tag on main that CI passed (README.md, "Releases"). Push a v* tag
# (a date: v2026.11.21) and this runs the whole of tests.yml on that commit; only if it passes
# does it make the GitHub release, its notes the PRs merged since the last one. On the Pi,
# `git checkout vTAG` and a bootstrap run installs it (README).
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/tests.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # A release is a point on main, nothing else: a tag anywhere else is refused before anything
      # is published.
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
