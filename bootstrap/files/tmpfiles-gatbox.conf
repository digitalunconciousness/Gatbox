# GATBOX (installed by gatbox-bootstrap.sh).
# The dump archive: <machine>/<label>_<sha1:8>.bin + .json, written by gatbox-dump (setgid: the owner's group too).
d /srv/gatbox                0755 root        root        -
d /srv/gatbox/roms           2775 gatbox-dump gatbox-dump -
# Dashboard dump requests and progress: gatbox-web (in group gatbox-dump) writes request.json, the job answers.
d /var/spool/gatbox-dump     2770 gatbox-dump gatbox-dump -
# Manuals: <machine>/<name>.pdf (+ .json, .txt). Fetched by the owner, uploaded through gatbox-web (group
# gatbox-manuals), read by gatbox-web (world-readable, like the archive). Setgid: new folders keep the group.
d /srv/gatbox/manuals        2775 root        gatbox-manuals -
# The hub config (gatbox-sync): /etc/gatbox/hub.conf, 600 root, holding the hub URLs and the
# device token, and one more file per extra hub in hubs.d/<name>.conf. The directory is not
# world-readable so its contents are not merely 600 but unreachable. Only the owner has a
# token, so nothing here writes one: hub.conf is created *empty* if it is missing (an empty
# file means "no hub"; an existing one is never written, only kept at 600 root), and hubs.d
# starts empty. Both have to exist because gatbox-sync.service loads them with
# LoadCredential=, and a missing path there fails the unit outright.
d /etc/gatbox                0750 root        root        -
d /etc/gatbox/hubs.d         0700 root        root        -
f /etc/gatbox/hub.conf       0600 root        root        -
# Wi-Fi requests from the dashboard and from a scanned code. 2770, not 2775: a request file
# holds a plaintext Wi-Fi key until gatbox-wifi takes it, so this is not world-readable.
d /var/spool/gatbox-wifi     2770 root        gatbox-wifi -
